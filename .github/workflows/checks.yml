name: checks

# Enforce the repository command contract on every change to main so broken
# imports, type errors, failing tests, or documentation drift cannot merge.
# Mirrors the local `make` targets exactly (see the root Makefile and AGENTS.md).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Full history: tools/docs/check.py verifies each ExecPlan's
          # base_commit / last_verified_commit exists in the repository, which a
          # shallow checkout cannot satisfy.
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          # pnpm is provided by corepack in the next step, so it is not on PATH
          # yet; disable setup-node@v5's default package-manager cache probe,
          # which would otherwise fail trying to run pnpm here.
          package-manager-cache: false

      - name: Enable pnpm via corepack
        run: corepack enable

      - name: Bootstrap all workspaces
        run: make bootstrap

      - name: Validate documentation
        run: make check-docs

      - name: Check architecture boundaries
        run: make check-architecture

      - name: Validate sealed product-demo harness
        run: make test-product-demo-unit

      - name: Run workspace checks
        run: make check

      - name: Install pinned Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run credential-free browser journey
        run: make test-e2e-demo

      - name: Enforce the 1,000-task browser performance budget
        run: make test-performance

      - name: Prove local completed-task restart recovery
        run: make test-recovery

      - name: Prove credential boundaries
        run: make test-security-boundary

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-failure-artifacts
          # Password controls are masked. Do not retain traces, auth state, or
          # reports from a journey that enters an access key.
          path: |
            output/playwright/test-results/**/test-failed-*.png
            output/playwright/recovery-results/**/test-failed-*.png
            output/playwright/performance-results/**/test-failed-*.png
          if-no-files-found: ignore

      - name: Upload synthetic performance report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: inbox-performance-report
          path: output/playwright/performance-report/*.json
          if-no-files-found: ignore

  visual-acceptance:
    name: binding route and journey visuals
    needs: verify
    # Expected pixels are captured on macOS 26 with Playwright's pinned Chromium
    # revision; keep the operating system and browser revision aligned.
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable pnpm via corepack
        run: corepack enable

      - name: Bootstrap all workspaces
        run: make bootstrap

      - name: Install pinned Chromium
        run: pnpm exec playwright install chromium

      - name: Compare desktop and phone screenshots
        run: make test-visual

      - name: Upload visual failure screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-acceptance-failure-screenshots
          path: output/playwright/visual-results/**/test-failed-*.png
          if-no-files-found: ignore

  hosted-acceptance:
    name: hosted golden journey
    needs: [verify, visual-acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: hosted-acceptance
    env:
      DEEPWORK_HOSTED_URL: ${{ secrets.DEEPWORK_HOSTED_URL }}
      DEEPWORK_E2E_ACCESS_KEY: ${{ secrets.DEEPWORK_E2E_ACCESS_KEY }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable pnpm via corepack
        run: corepack enable

      - name: Install pinned web dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Require hosted acceptance configuration
        run: |
          test -n "$DEEPWORK_HOSTED_URL"
          test -n "$DEEPWORK_E2E_ACCESS_KEY"

      - name: Run hosted golden journey
        run: make test-hosted

      - name: Upload hosted browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hosted-acceptance-failure-artifacts
          # Traces and reports are deliberately excluded: the hosted journey
          # enters a protected access key. A failure screenshot masks password
          # controls and is the only retained browser artifact.
          path: output/playwright/hosted-results/**/test-failed-*.png
          if-no-files-found: ignore
